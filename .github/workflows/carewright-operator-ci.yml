name: Carewright Operator CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit and envtest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carewright-operator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: carewright-operator/go.mod
          cache-dependency-path: carewright-operator/go.sum
      - run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: carewright-operator/go.mod
          cache-dependency-path: carewright-operator/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          working-directory: carewright-operator

  e2e:
    name: Kind end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carewright-operator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: carewright-operator/go.mod
          cache-dependency-path: carewright-operator/go.sum
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - run: make test-e2e
