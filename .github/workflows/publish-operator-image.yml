name: Build and publish Carewright Operator image

on:
  push:
    branches: [main]
    paths:
      - 'carewright-operator/**'
      - '.github/workflows/publish-operator-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-operator-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: tag
        run: echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: carewright-operator
          file: carewright-operator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: quay.io/carewright/carewright-operator:${{ steps.tag.outputs.value }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=carewright-operator
          cache-to: type=gha,mode=min,scope=carewright-operator

      - name: Update latest tag
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            --tag quay.io/carewright/carewright-operator:latest \
            quay.io/carewright/carewright-operator:${{ steps.tag.outputs.value }}
