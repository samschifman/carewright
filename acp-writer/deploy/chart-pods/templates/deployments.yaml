{{- range $name, $pod := .Values.pods }}
{{- if $pod.enabled }}
{{- if not (and $.Values.openshellMode $pod.sandboxed) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    app.kubernetes.io/name: acp-writer-{{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
    app.kubernetes.io/part-of: cpg-to-acp
    security-profile: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: acp-writer-{{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: acp-writer-{{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
        app.kubernetes.io/part-of: cpg-to-acp
        security-profile: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.registry }}/{{ $.Values.image.namespace }}/{{ $pod.image }}:{{ $pod.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ $pod.port }}
              protocol: TCP
          env:
            - name: MLFLOW_TRACKING_URI
              value: {{ $.Values.mlflow.trackingUri | quote }}
            {{- if $pod.env }}
            {{- if $pod.env.litellmUrl }}
            - name: LITELLM_URL
              value: {{ $pod.env.litellmUrl | quote }}
            {{- end }}
            {{- if $pod.env.llmModel }}
            - name: LLM_MODEL
              value: {{ $pod.env.llmModel | quote }}
            {{- end }}
            {{- if $pod.env.embeddingProvider }}
            - name: EMBEDDING_PROVIDER
              value: {{ $pod.env.embeddingProvider | quote }}
            {{- end }}
            {{- if $pod.env.embeddingModel }}
            - name: EMBEDDING_MODEL
              value: {{ $pod.env.embeddingModel | quote }}
            {{- end }}
            {{- if $pod.env.llmRequestTimeout }}
            - name: LLM_REQUEST_TIMEOUT
              value: {{ $pod.env.llmRequestTimeout | quote }}
            {{- end }}
            {{- if $pod.env.kogitoUrl }}
            - name: KOGITO_URL
              value: {{ $pod.env.kogitoUrl | quote }}
            {{- end }}
            {{- if $pod.env.fhirServerUrl }}
            - name: FHIR_SERVER_URL
              value: {{ $pod.env.fhirServerUrl | quote }}
            {{- end }}
            {{- if $pod.env.automationServiceUrl }}
            - name: AUTOMATION_SERVICE_URL
              value: {{ $pod.env.automationServiceUrl | quote }}
            {{- end }}
            {{- if $pod.env.decisionEngineUrl }}
            - name: DECISION_ENGINE_URL
              value: {{ $pod.env.decisionEngineUrl | quote }}
            {{- end }}
            {{- if $pod.env.sonataflowUrl }}
            - name: SONATAFLOW_URL
              value: {{ $pod.env.sonataflowUrl | quote }}
            {{- end }}
            {{- if $pod.env.minioEndpoint }}
            - name: MINIO_ENDPOINT
              value: {{ $pod.env.minioEndpoint | quote }}
            {{- end }}
            {{- if $pod.env.llmReasoningUrl }}
            - name: LLM_REASONING_URL
              value: {{ $pod.env.llmReasoningUrl | quote }}
            {{- end }}
            {{- if $pod.env.bffHost }}
            - name: BFF_HOST
              value: {{ $pod.env.bffHost | quote }}
            {{- end }}
            {{- /* AI Transparency (issue #169) */}}
            {{- if hasKey $pod.env "capturePrompts" }}
            - name: ACP_CAPTURE_PROMPTS
              value: {{ $pod.env.capturePrompts | quote }}
            {{- end }}
            {{- if $pod.env.modelCardUrl }}
            - name: LLM_MODEL_CARD_URL
              value: {{ $pod.env.modelCardUrl | quote }}
            {{- end }}
            {{- if $pod.env.reviewerDisplay }}
            - name: ACP_REVIEWER_DISPLAY
              value: {{ $pod.env.reviewerDisplay | quote }}
            {{- end }}
            {{- if $pod.env.reviewerReference }}
            - name: ACP_REVIEWER_REFERENCE
              value: {{ $pod.env.reviewerReference | quote }}
            {{- end }}
            {{- if $pod.env.reviewerIdSystem }}
            - name: ACP_REVIEWER_ID_SYSTEM
              value: {{ $pod.env.reviewerIdSystem | quote }}
            {{- end }}
            {{- if $pod.env.reviewerIdValue }}
            - name: ACP_REVIEWER_ID_VALUE
              value: {{ $pod.env.reviewerIdValue | quote }}
            {{- end }}
            {{- end }}
            {{- if $pod.secrets }}
            {{- if $pod.secrets.llm }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-credentials
                  key: LLM_API_KEY
            {{- end }}
            {{- if $pod.secrets.minio }}
            - name: ARTIFACT_STORE_URL
              value: "http://minio:9000"
            - name: ARTIFACT_STORE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: ARTIFACT_STORE_ACCESS_KEY
            - name: ARTIFACT_STORE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: ARTIFACT_STORE_SECRET_KEY
            {{- end }}
            {{- if $pod.secrets.fhir }}
            - name: FHIR_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: fhir-client-credentials
                  key: FHIR_CLIENT_ID
                  optional: true
            - name: FHIR_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fhir-client-credentials
                  key: FHIR_CLIENT_SECRET
                  optional: true
            {{- end }}
            {{- end }}
          {{- if $pod.volumes }}
          volumeMounts:
            {{- range $vol := $pod.volumes }}
            - name: {{ $vol.name }}
              mountPath: {{ $vol.mountPath }}
              {{- if $vol.subPath }}
              subPath: {{ $vol.subPath }}
              {{- end }}
              readOnly: true
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $pod.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $pod.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml $pod.resources | nindent 12 }}
      {{- if $pod.volumes }}
      volumes:
        {{- range $vol := $pod.volumes }}
        - name: {{ $vol.name }}
          secret:
            secretName: {{ $vol.secretName }}
        {{- end }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
