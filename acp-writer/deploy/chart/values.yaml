image:
  registry: quay.io
  namespace: carewright
  name: acp-writer
  tag: latest

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  port: 8082

route:
  enabled: true

decisionService:
  url: http://cpg-decision-service:8081

mlflow:
  trackingUri: https://mlflow-redhat-ods-applications.apps.rosa.agentic-mcp.jolf.p3.openshiftapps.com

# AI Transparency on FHIR (issue #169). Only non-empty values are emitted.
aiTransparency:
  # Capture rendered prompts as AI-InputPrompt DocumentReferences. Prompts embed
  # patient data — set to "false" before touching real PHI.
  capturePrompts: "true"
  # Optional model-card URL → AI-ModelCard DocumentReference.
  modelCardUrl: ""
  # Default human verifier recorded on approve (request payload may override).
  reviewerDisplay: "Demo Clinician"
  reviewerReference: "Practitioner/demo-clinician"
  reviewerIdSystem: ""
  reviewerIdValue: ""
