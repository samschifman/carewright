# nginx location blocks for the acp-writer React SPA, installed into the UBI
# nginx default server via /opt/app-root/etc/nginx.default.d/. ${BFF_HOST} is
# substituted at startup by nginx-start/50-envsubst.sh. Same pattern as
# cpg-ingester/ui.
location /health {
    access_log off;
    return 200 '{"status":"UP","service":"acp-writer-ui"}';
    add_header Content-Type application/json;
}

location = /smart-config.json {
    return 404;
}

location /api/ {
    access_log off;
    client_max_body_size 20m;
    proxy_pass http://${BFF_HOST}/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 180s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
}

location / {
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    try_files $uri $uri/ /index.html;
}
