services:

  # --- Medplum (mock-EHR FHIR server) ---

  medplum-postgres:
    image: quay.io/carewright/postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: medplum
      POSTGRES_PASSWORD: medplum
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
      - "-c"
      - "statement_timeout=60000"
      - "-c"
      - "default_transaction_isolation=REPEATABLE READ"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements,auto_explain"
    volumes:
      - medplum-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medplum"]
      interval: 10s
      timeout: 5s
      retries: 5

  medplum-redis:
    image: quay.io/carewright/redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass medplum
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "medplum", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  medplum-server:
    image: quay.io/carewright/medplum-server:5.1.27
    restart: unless-stopped
    ports:
      - "8103:8103"
    depends_on:
      medplum-postgres:
        condition: service_healthy
      medplum-redis:
        condition: service_healthy
    environment:
      MEDPLUM_PORT: "8103"
      MEDPLUM_BASE_URL: "http://localhost:8103/"
      MEDPLUM_APP_BASE_URL: "http://localhost:3002/"
      MEDPLUM_STORAGE_BASE_URL: "http://localhost:8103/storage/"
      MEDPLUM_DATABASE_HOST: medplum-postgres
      MEDPLUM_DATABASE_PORT: "5432"
      MEDPLUM_DATABASE_DBNAME: medplum
      MEDPLUM_DATABASE_USERNAME: medplum
      MEDPLUM_DATABASE_PASSWORD: medplum
      MEDPLUM_REDIS_HOST: medplum-redis
      MEDPLUM_REDIS_PORT: "6379"
      MEDPLUM_REDIS_PASSWORD: medplum
      MEDPLUM_BINARY_STORAGE: "file:./binary/"
      MEDPLUM_SUPPORT_EMAIL: '"CareView EHR" <support@example.com>'
      MEDPLUM_GOOGLE_CLIENT_ID: ""
      MEDPLUM_GOOGLE_CLIENT_SECRET: ""
      MEDPLUM_RECAPTCHA_SITE_KEY: ""
      MEDPLUM_RECAPTCHA_SECRET_KEY: ""
      MEDPLUM_MAX_JSON_SIZE: "5mb"
      MEDPLUM_MAX_BATCH_SIZE: "50mb"
      MEDPLUM_RATE_LIMITS_ENABLED: "false"
      MEDPLUM_BOT_LAMBDA_ROLE_ARN: ""
      MEDPLUM_BOT_LAMBDA_LAYER_NAME: "medplum-bot-layer"
      MEDPLUM_VM_CONTEXT_BOTS_ENABLED: "true"
      MEDPLUM_DEFAULT_BOT_RUNTIME_VERSION: "vmcontext"
      MEDPLUM_ALLOWED_ORIGINS: "*"
      MEDPLUM_INTROSPECTION_ENABLED: "true"
      MEDPLUM_SHUTDOWN_TIMEOUT_MILLISECONDS: "30000"
    volumes:
      - ./mock-EHR/deploy/medplum.config.json:/usr/src/medplum/medplum.config.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8103/healthcheck').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  medplum-loader:
    image: localhost/slice-local_medplum-loader:latest
    build:
      context: ./mock-EHR
      dockerfile: deploy/Containerfile.loader
    env_file:
      - ./mock-EHR/deploy/.env
    depends_on:
      medplum-server:
        condition: service_healthy
    environment:
      MEDPLUM_BASE_URL: "http://medplum-server:8103"
      DATA_DIR: "/data"
      SMART_CONFIG_DIR: "/config/acp-writer-ui"
      FHIR_ENV_DIR: "/config"
    volumes:
      - ./mock-EHR/deploy/load-medplum.sh:/load-medplum.sh:ro
      - ./mock-EHR/data:/data:ro
      - ./acp-writer/ui/public:/config/acp-writer-ui
      - ./.medplum:/config
    entrypoint: ["/bin/bash", "/load-medplum.sh"]

  medplum-app:
    image: quay.io/carewright/medplum-app:5.1.27
    restart: unless-stopped
    ports:
      - "3002:3000"
    depends_on:
      medplum-server:
        condition: service_healthy

  mock-ehr-app:
    build:
      context: ./mock-EHR/ui
      dockerfile: Containerfile
    ports:
      - "3000:8080"
    depends_on:
      medplum-server:
        condition: service_healthy

  # --- Application services ---

  kogito:
    build:
      context: ./acp-writer/decision-service
      dockerfile: deploy/Containerfile
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/q/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  litellm:
    build:
      context: ./platform/litellm
      dockerfile: deploy/Containerfile
    ports:
      - "4000:4000"
    env_file:
      - ./platform/litellm/deploy/.env

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0
    ports:
      - "5000:5000"
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  acp-writer:
    build:
      context: .
      dockerfile: acp-writer/deploy/Containerfile
    ports:
      - "8082:8082"
    depends_on:
      kogito:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      automation:
        condition: service_healthy
      litellm:
        condition: service_started
      medplum-server:
        condition: service_healthy
    environment:
      - KOGITO_URL=http://kogito:8081
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - AUTOMATION_SERVICE_URL=http://automation:8080
      - ACP_JOB_STORE_DIR=/data/jobs
      - LITELLM_URL=http://litellm:4000
      - LITELLM_API_KEY=sk-change-me
      - FHIR_SERVER_URL=http://medplum-server:8103/fhir/R4
      # --- AI Transparency (issue #169) ---
      # Capture rendered prompts as AI-InputPrompt DocumentReferences. Prompts
      # embed patient data — MUST be set to "false" before touching real PHI.
      - ACP_CAPTURE_PROMPTS=true
      # Optional model-card URL → AI-ModelCard DocumentReference. Unset = omit.
      # - LLM_MODEL_CARD_URL=
      # Default human verifier recorded on approve (request payload may override).
      - ACP_REVIEWER_DISPLAY=Demo Clinician
      - ACP_REVIEWER_REFERENCE=Practitioner/demo-clinician
      # - ACP_REVIEWER_ID_SYSTEM=http://hl7.org/fhir/sid/us-npi
      # - ACP_REVIEWER_ID_VALUE=
    env_file:
      - path: .medplum/medplum-fhir.env
        required: false
    volumes:
      - acp-job-data:/data/jobs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  acp-writer-ui:
    build:
      context: .
      dockerfile: acp-writer/ui/Containerfile
    ports:
      - "3001:8080"
    depends_on:
      acp-writer:
        condition: service_healthy
    environment:
      - BFF_HOST=acp-writer:8082
    volumes:
      # Written by medplum-loader on every load; the client id changes with
      # every fresh Medplum, so it must never be baked into the image.
      - ./acp-writer/ui/public/smart-config.json:/opt/app-root/src/smart-config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  automation:
    build:
      context: .
      dockerfile: automation/deploy/Containerfile
    ports:
      - "8096:8080"
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      - AUTOMATION_STORE_DIR=/data
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - automation-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  cpg-ingester:
    build:
      context: .
      dockerfile: cpg-ingester/deploy/Containerfile
    depends_on:
      acp-writer:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      - ACP_WRITER_URL=http://acp-writer:8082
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      # Docling/figure knobs (defaults shown; blank/unset also = default).
      - INGESTION_OCR_ENABLED=true            # conditional OCR re-parse for scanned PDFs
      - FIGURE_INTERPRETATION_ENABLED=true    # vision figure interpretation
      - FIGURE_INTERPRETATION_MAX_FIGURES=100 # vision-call budget per document
    profiles:
      - ingester

  # --- cpg-ingester pod-split services ---

  cpg-ingester-ingestion:
    build:
      context: .
      dockerfile: cpg-ingester/deploy/pods/Containerfile.ingestion
    ports:
      - "8090:8080"
    environment:
      - INGESTION_OCR_ENABLED=true  # conditional OCR re-parse for scanned PDFs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - ingester-pods

  cpg-ingester-llm:
    build:
      context: .
      dockerfile: cpg-ingester/deploy/pods/Containerfile.llm-analysis
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      - LITELLM_URL=http://litellm:4000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      # Vision figure interpretation runs in this (LLM-egress) pod.
      - FIGURE_INTERPRETATION_ENABLED=true    # vision figure interpretation
      - FIGURE_INTERPRETATION_MAX_FIGURES=100  # vision-call budget per document
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - ingester-pods

  cpg-ingester-assembly:
    build:
      context: .
      dockerfile: cpg-ingester/deploy/pods/Containerfile.assembly
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - ingester-pods

  cpg-ingester-delivery:
    build:
      context: .
      dockerfile: cpg-ingester/deploy/pods/Containerfile.delivery
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - ingester-pods

  cpg-ingester-bff:
    build:
      context: .
      dockerfile: cpg-ingester/deploy/pods/Containerfile.bff
    ports:
      - "8095:8080"
    environment:
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - ingester-pods

  cpg-ingester-ui:
    build:
      context: .
      dockerfile: cpg-ingester/ui/Containerfile
    ports:
      - "3003:8080"
    depends_on:
      cpg-ingester-bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - ingester-pods

volumes:
  medplum-postgres-data:
  automation-data:
  acp-job-data:
