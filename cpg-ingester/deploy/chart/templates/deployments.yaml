{{- range $name, $pod := .Values.pods }}
{{- if $pod.enabled }}
{{- if not (and $.Values.openshellMode $pod.sandboxed) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    app.kubernetes.io/name: cpg-ingester-{{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
    app.kubernetes.io/part-of: cpg-to-acp
    security-profile: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cpg-ingester-{{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cpg-ingester-{{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
        app.kubernetes.io/part-of: cpg-to-acp
        security-profile: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.registry }}/{{ $.Values.image.namespace }}/{{ $pod.image }}:{{ $pod.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ $pod.port }}
              protocol: TCP
          env:
            - name: MLFLOW_TRACKING_URI
              value: {{ $.Values.mlflow.trackingUri | quote }}
            {{- if $pod.env }}
            {{- if $pod.env.litellmUrl }}
            - name: LITELLM_URL
              value: {{ $pod.env.litellmUrl | quote }}
            {{- end }}
            {{- if $pod.env.llmModel }}
            - name: LLM_MODEL
              value: {{ $pod.env.llmModel | quote }}
            {{- end }}
            {{- if $pod.env.llmRequestTimeout }}
            - name: LLM_REQUEST_TIMEOUT
              value: {{ $pod.env.llmRequestTimeout | quote }}
            {{- end }}
            {{- if $pod.env.bffHost }}
            - name: BFF_HOST
              value: {{ $pod.env.bffHost | quote }}
            {{- end }}
            {{- if $pod.env.sonataflowUrl }}
            - name: SONATAFLOW_URL
              value: {{ $pod.env.sonataflowUrl | quote }}
            {{- end }}
            {{- if $pod.env.minioEndpoint }}
            - name: MINIO_ENDPOINT
              value: {{ $pod.env.minioEndpoint | quote }}
            {{- end }}
            {{- if $pod.env.acpWriterBffUrl }}
            - name: ACP_WRITER_BFF_URL
              value: {{ $pod.env.acpWriterBffUrl | quote }}
            {{- end }}
            {{- if $pod.env.bpmnPreflightUrl }}
            - name: BPMN_PREFLIGHT_URL
              value: {{ $pod.env.bpmnPreflightUrl | quote }}
            {{- end }}
            {{- if hasKey $pod.env "ingestionOcrEnabled" }}
            - name: INGESTION_OCR_ENABLED
              value: {{ $pod.env.ingestionOcrEnabled | quote }}
            {{- end }}
            {{- if hasKey $pod.env "figureInterpretationEnabled" }}
            - name: FIGURE_INTERPRETATION_ENABLED
              value: {{ $pod.env.figureInterpretationEnabled | quote }}
            {{- end }}
            {{- if hasKey $pod.env "figureInterpretationMaxFigures" }}
            - name: FIGURE_INTERPRETATION_MAX_FIGURES
              value: {{ $pod.env.figureInterpretationMaxFigures | quote }}
            {{- end }}
            {{- end }}
            {{- if $pod.secrets }}
            {{- if $pod.secrets.llm }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-credentials
                  key: LLM_API_KEY
            {{- end }}
            {{- if $pod.secrets.minio }}
            - name: ARTIFACT_STORE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: ARTIFACT_STORE_ACCESS_KEY
            - name: ARTIFACT_STORE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: ARTIFACT_STORE_SECRET_KEY
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $pod.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $pod.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml $pod.resources | nindent 12 }}
{{- end }}
{{- end }}
{{- end }}
