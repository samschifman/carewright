image:
  registry: quay.io
  namespace: carewright

# When true, sandboxed pods render no Deployment (OpenShell sandboxes replace
# them) and their Services select the openshell-router instead of pod labels.
openshellMode: true

pods:
  ingestion:
    enabled: true
    sandboxed: true
    image: cpg-ingester-ingestion
    tag: latest
    port: 8080
    env:
      # Conditional OCR re-parse for scanned/image-only PDFs.
      # Set to "false" if the RapidOCR models are unavailable in the image.
      ingestionOcrEnabled: "true"
    secrets:
      minio: true
    resources:
      # Docling models loaded at runtime — OOMs below 3Gi (deployment-log evidence)
      requests:
        cpu: 500m
        memory: 3Gi
      limits:
        cpu: "2"
        memory: 4Gi

  llm-analysis:
    enabled: true
    sandboxed: true
    image: cpg-ingester-llm
    tag: latest
    port: 8080
    env:
      # Bare origin — get_llm() appends /v1. Deploy scripts override this.
      litellmUrl: http://localhost:4000
      llmModel: default
      llmRequestTimeout: "600"
      # Vision figure interpretation runs in this (LLM-egress) pod.
      figureInterpretationEnabled: "true"
      # Ceiling on vision calls per document — a figure compendium must not fan
      # out into hundreds of frontier-model calls.
      figureInterpretationMaxFigures: "100"
    secrets:
      llm: true
      minio: true
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi

  assembly:
    enabled: true
    sandboxed: true
    image: cpg-ingester-assembly
    tag: latest
    port: 8080
    env:
      # Optional validation preflight endpoint; unset in the default deployment.
      bpmnPreflightUrl: ""
    secrets:
      minio: true
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi

  delivery:
    enabled: true
    sandboxed: true
    image: cpg-ingester-delivery
    tag: latest
    port: 8080
    secrets:
      minio: true
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi

  bff:
    enabled: true
    sandboxed: false
    image: cpg-ingester-bff
    tag: latest
    port: 8080
    env:
      sonataflowUrl: http://cpgingester:80
      minioEndpoint: http://minio:9000
      acpWriterBffUrl: http://acp-writer-bff:8080
    secrets:
      minio: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  ui:
    enabled: true
    sandboxed: false
    image: cpg-ingester-ui
    tag: latest
    port: 8080
    route: true
    env:
      bffHost: cpg-ingester-bff:8080
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

mlflow:
  # Overridden by deploy scripts from cluster.env MLFLOW_TRACKING_URI
  trackingUri: ""
