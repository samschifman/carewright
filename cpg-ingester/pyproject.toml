[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpg-ingester"
version = "0.2.0"
description = "Multi-agent pipeline: parse CPGs, extract DMN decision logic and recommendations"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "docling==2.113.0",
    "docling-core==2.87.1",
    # Conditional-OCR re-parse: docling builds RapidOcrOptions when a
    # PDF looks scanned. These must be real package deps — not just baked into
    # Containerfile.ingestion — or a fresh `pip install .` (CI, a teammate's
    # venv) crashes on the first scanned PDF. Models ship bundled in the wheel
    # (offline; no system binary, no network).
    "rapidocr-onnxruntime>=1.2,<2",
    "onnxruntime>=1.19,<2",
    "openai>=1.0",
    "click>=8.0",
    "requests>=2.31",
    "cpg-contracts",
    "mlflow>=2.15",
    "langgraph>=0.4",
    "langchain-openai>=0.3",
    "langchain-mcp-adapters>=0.3",
    "lxml>=5.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
]

[project.scripts]
cpg-parse = "cpg_ingester.parse:main"
cpg-deploy-dmn = "cpg_ingester.deploy:main"
cpg-ingest = "cpg_ingester.cli:main"

[project.optional-dependencies]
dev = [
    "reportlab>=4,<6",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",
    "click>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cpg_ingester = ["resources/schemas/*.xsd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: requires a running LLM (LiteLLM on localhost:4000) — run with -m live",
]
