image:
  registry: quay.io
  namespace: carewright

postgres:
  # Overridden by deploy scripts with the correct namespace
  image: quay.io/carewright/postgres:16
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  storage:
    size: 5Gi
    storageClass: gp3-csi
  service:
    port: 5432

redis:
  image: quay.io/carewright/redis:7
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  service:
    port: 6379

medplumServer:
  image: quay.io/carewright/medplum-server:5.1.27
  replicas: 1
  port: 8103
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  baseUrl: ""
  appBaseUrl: ""
  service:
    port: 8103

medplumApp:
  image: quay.io/carewright/medplum-app:5.1.27
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  service:
    port: 3000

mockEhrApp:
  image:
    name: mock-ehr-app
    tag: latest
  # Exact origins (comma-separated, scheme://host[:port]) the OAuth page may
  # redirect to after sign-in. Served to the UI in /config.json, so one
  # published image works for any deployment. Leave empty to allow exactly the
  # writer origin (acpWriterOrigin below). A list set here may add origins but
  # must include the writer origin.
  smartRedirectOrigins: ""
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  service:
    port: 8080
  route:
    enabled: true

loader:
  # Set to false to skip the data loader job (when medplum-user-credentials secret is absent)
  enabled: true
  image:
    name: medplum-loader
    tag: latest

# Cluster domain for route hostnames (overridden by deploy scripts)
clusterDomain: ""

# The writer UI origin (scheme://host[:port]) as the browser sees it. One value
# drives both the SMART client the loader registers in the EHR (launch and
# redirect URIs) and the OAuth page's redirect allowlist. This is the EHR side
# only: a launch also needs a writer BFF with the SMART client credentials and
# the same public origin (ACP_PUBLIC_ORIGIN), which today is the
# operator-managed writer (spec.smart.publicOrigin). Empty derives
# https://acp-ui-<namespace>.<clusterDomain>, the script-deployed UI route,
# whose writer does not receive SMART settings.
acpWriterOrigin: ""
