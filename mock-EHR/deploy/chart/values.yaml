image:
  registry: quay.io
  namespace: carewright

postgres:
  # Overridden by deploy scripts with the correct namespace
  image: quay.io/carewright/postgres:16
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  storage:
    size: 5Gi
    storageClass: gp3-csi
  service:
    port: 5432

redis:
  image: quay.io/carewright/redis:7
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  service:
    port: 6379

medplumServer:
  image: quay.io/carewright/medplum-server:5.1.27
  replicas: 1
  port: 8103
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  baseUrl: ""
  appBaseUrl: ""
  service:
    port: 8103

medplumApp:
  image: quay.io/carewright/medplum-app:5.1.27
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  service:
    port: 3000

mockEhrApp:
  image:
    name: mock-ehr-app
    tag: latest
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  service:
    port: 8080
  route:
    enabled: true

loader:
  # Set to false to skip the data loader job (when medplum-user-credentials secret is absent)
  enabled: true
  image:
    name: medplum-loader
    tag: latest

# Cluster domain for route hostnames (overridden by deploy scripts)
clusterDomain: ""
